name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command just check

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command just build-web
      - run: >-
          nix develop --command wrangler pages deploy build/web-release/site
          --project-name=phong-computer --branch=main
      # Tell IndexNow search engines (Bing, Yandex, Seznam, Naver) that the
      # site changed. A refusal is only a warning; the deploy has succeeded.
      - run: >-
          curl --silent --show-error --fail-with-body
          --request POST https://api.indexnow.org/indexnow
          --header 'Content-Type: application/json; charset=utf-8'
          --data '{"host":"phong.computer","key":"e7c1deba55693f3543af19e2815bbff3",
          "keyLocation":"https://phong.computer/e7c1deba55693f3543af19e2815bbff3.txt",
          "urlList":["https://phong.computer/","https://phong.computer/llms.txt"]}'
          || echo "::warning::IndexNow did not accept the update"
